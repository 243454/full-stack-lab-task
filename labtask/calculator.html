<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            background-color: lightgray;
            font-family: Arial;
        }

        .calculator {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background-color: black;
            border-radius: 10px;
        }

        .display {
            width: 100%;
            height: 50px;
            font-size: 25px;
            text-align: right;
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 50px;
            font-size: 20px;
            border: none;
            border-radius: 5px;
        }

        .operator {
            background-color: orange;
            color: white;
        }

        .equal {
            background-color: green;
            color: white;
        }

        .clear {
            background-color: red;
            color: white;
            grid-column: span 4;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" class="display" value="0">

        <div class="buttons">

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">+</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operator">×</button>

            <button>0</button>
            <button>.</button>
            <button class="equal">=</button>
            <button class="operator">÷</button>

            <button class="clear">Clear</button>

        </div>

    </div>

</body>
</html>
