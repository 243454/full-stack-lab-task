<!DOCTYPE html>
<html>
<head>
    <title>Calculator</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
        }

        .calculator {
            width: 250px;
            margin: 100px auto;
            padding: 20px;
            background: lightgray;
        }

        input {
            width: 220px;
            height: 40px;
            font-size: 20px;
            margin-bottom: 10px;
        }

        button {
            width: 50px;
            height: 40px;
            margin: 3px;
            font-size: 18px;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <input type="text" value="0">

        <br>

        <button>7</button>
        <button>8</button>
        <button>9</button>
        <button>+</button>

        <br>

        <button>4</button>
        <button>5</button>
        <button>6</button>
        <button>-</button>

        <br>

        <button>1</button>
        <button>2</button>
        <button>3</button>
        <button>*</button>

        <br>

        <button>0</button>
        <button>/</button>
        <button>=</button>
        <button>C</button>

    </div>

</body>
</html>
